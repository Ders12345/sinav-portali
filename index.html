<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş PDF Çalışma Asistanı & Sınav Hazırlayıcı</title>
    <!-- PDF.js Entegrasyonu -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --accent-color: #4e148c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-panel {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header-panel h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .header-panel p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .card-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ed;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"], select, input[type="file"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--secondary-color); }
        .btn-success { background-color: #2e7d32; color: white; }
        .btn-success:hover { background-color: #1b5e20; }
        .btn-outline { background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .status-info { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; display: block; }
        .status-success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; display: block; }
        .status-error { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; display: block; }

        /* Flashcard Tasarımı */
        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .flashcard {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            min-height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 10px;
        }

        .flashcard-front {
            background-color: #ffffff;
            color: var(--text-color);
            font-weight: 600;
            border-left: 5px solid var(--primary-color);
        }

        .flashcard-back {
            background-color: #f0f4f8;
            color: #1a202c;
            transform: rotateY(180deg);
            border-left: 5px solid #2e7d32;
        }

        /* Quiz Tasarımı */
        .quiz-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quiz-card h4 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .quiz-option:hover {
            background: #e9ecef;
        }

        .tab-menu {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header-panel">
        <h1>📚 Akıllı PDF Çalışma Masası</h1>
        <p>PDF belgelerinizi analiz edin, otomatik Flashcard kartları ve çoktan seçmeli testler üretin.</p>
    </div>

    <!-- Yapılandırma Paneli -->
    <div class="card-panel">
        <div class="grid-2">
            <div class="form-group">
                <label for="apiProvider">Yapay Zeka Sağlayıcısı</label>
                <select id="apiProvider" onchange="onProviderChange()">
                    <option value="groq">Groq AI (Llama 3.3 70B)</option>
                    <option value="gemini">Google Gemini AI (Gemini 1.5 Flash)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="apiKey">API Anahtarı (API Key)</label>
                <input type="password" id="apiKey" placeholder="gsk_... veya AIzaSy...">
            </div>
        </div>

        <div class="form-group">
            <label for="pdfInput">PDF Belgesi Yükle</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div id="statusBox" class="status-box"></div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateCardsAction()">🎴 Flashcard Oluştur</button>
            <button class="btn btn-success" onclick="generateQuizAction()">📝 Test Hazırla</button>
        </div>
    </div>

    <!-- İçerik Sekmeleri -->
    <div class="card-panel">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('cardsTab', this)">Flashcardlar (<span id="cardCount">0</span>)</button>
            <button class="tab-btn" onclick="switchTab('quizTab', this)">Test Soruları (<span id="quizCount">0</span>)</button>
        </div>

        <div id="cardsTab" class="tab-content active">
            <div id="flashcardContainer" class="flashcard-grid">
                <p style="color: #777; grid-column: 1/-1;">Henüz kart üretilmedi. Bir PDF yükleyip "Flashcard Oluştur" butonuna basın.</p>
            </div>
        </div>

        <div id="quizTab" class="tab-content">
            <div id="quizContainer">
                <p style="color: #777;">Henüz test soruları üretilmedi. Bir PDF yükleyip "Test Hazırla" butonuna basın.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Global Uygulama Hafızası
    const appState = {
        pdfText: "",
        flashcards: [],
        quiz: []
    };

    function onProviderChange() {
        const provider = document.getElementById('apiProvider').value;
        const input = document.getElementById('apiKey');
        if (provider === 'gemini') {
            input.placeholder = "Google AI Studio'dan aldığınız Gemini API Key";
        } else {
            input.placeholder = "Groq Console'dan aldığınız gsk_... Key";
        }
    }

    function showStatus(text, type = 'info') {
        const box = document.getElementById('statusBox');
        box.className = `status-box status-${type}`;
        box.innerText = text;
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // PDF.js ile Arka Planda Metin Ayıklama
    document.getElementById('pdfInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        showStatus("PDF belgesi taranıyor ve metinler ayıklanıyor...", "info");

        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            let extractedText = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageStrings = content.items.map(item => item.str);
                extractedText += `\n--- Sayfa ${i} ---\n` + pageStrings.join(" ");
            }

            if (!extractedText.trim()) {
                throw new Error("PDF metni okunamadı. Görsel ağırlıklı (OCR gereken) bir PDF olabilir.");
            }

            appState.pdfText = extractedText;
            showStatus(`✅ PDF Metni Okundu: Toplam ${pdf.numPages} sayfa ve ${extractedText.length} karakter yüklendi.`, "success");
        } catch (err) {
            console.error(err);
            showStatus("❌ PDF Okuma Hatası: " + err.message, "error");
        }
    });

    // Ortak API İletişim Katmanı
    async function requestAI(systemPrompt, userQuery) {
        const provider = document.getElementById('apiProvider').value;
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!apiKey) {
            alert("Lütfen geçerli bir API Anahtarı girin!");
            throw new Error("API Key girilmemiş");
        }

        if (!appState.pdfText) {
            alert("Lütfen işlem yapmadan önce bir PDF yükleyin!");
            throw new Error("PDF verisi yok");
        }

        showStatus("🤖 Yapay zeka PDF içeriğini inceliyor ve veri üretiyor...", "info");

        const promptText = `Aşağıdaki PDF içeriğine dayanarak istenen çıktıyı tam istenen JSON formatında ver.\n\nPDF İÇERİĞİ:\n${appState.pdfStateText || appState.pdfText.substring(0, 18000)}\n\nİSTEK: ${userQuery}`;

        if (provider === 'groq') {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    response_format: { type: "json_object" },
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: promptText }
                    ]
                })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || "Groq Bağlantı Hatası");
            }

            const data = await res.json();
            return JSON.parse(data.choices[0].message.content);

        } else if (provider === 'gemini') {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${systemPrompt}\n\n${promptText}` }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || "Gemini Bağlantı Hatası");
            }

            const data = await res.json();
            const rawText = data.candidates[0].content.parts[0].text;
            return JSON.parse(rawText);
        }
    }

    // FLASHCARD ÜRETİMİ VE RENDER
    async function generateCardsAction() {
        const systemPrompt = `Sadece geçerli bir JSON yanıtı döndür. Yapı tam olarak şöyle olmalıdır:
{
  "cards": [
    { "front": "Önemli Soru veya Terim", "back": "Açıklaması veya Cevabı" }
  ]
}`;

        try {
            const res = await requestAI(systemPrompt, "PDF'ten 6 adet kritik bilgi kartı çıkar.");
            
            // Dizi (Array) Garantileme Mekanizması
            let cardList = [];
            if (Array.isArray(res)) cardList = res;
            else if (res && Array.isArray(res.cards)) cardList = res.cards;
            else if (res && Array.isArray(res.flashcards)) cardList = res.flashcards;

            appState.flashcards = cardList;
            renderFlashcards();
            showStatus(`✅ ${cardList.length} adet Flashcard üretildi!`, "success");
        } catch (err) {
            console.error(err);
            showStatus("❌ Kart Üretim Hatası: " + err.message, "error");
        }
    }

    function renderFlashcards() {
        const container = document.getElementById('flashcardContainer');
        const countSpan = document.getElementById('cardCount');
        container.innerHTML = "";
        countSpan.innerText = appState.flashcards.length;

        if (!Array.isArray(appState.flashcards) || appState.flashcards.length === 0) {
            container.innerHTML = `<p style="color: #777; grid-column: 1/-1;">Kart bulunamadı.</p>`;
            return;
        }

        appState.flashcards.forEach(cardData => {
            const el = document.createElement('div');
            el.className = 'flashcard';
            el.onclick = () => el.classList.toggle('flipped');
            
            const frontText = cardData.front || cardData.question || "Soru";
            const backText = cardData.back || cardData.answer || "Cevap";

            el.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-front">${frontText}</div>
                    <div class="flashcard-back">${backText}</div>
                </div>
            `;
            container.appendChild(el);
        });
    }

    // QUIZ (TEST) ÜRETİMİ VE RENDER
    async function generateQuizAction() {
        const systemPrompt = `Sadece geçerli bir JSON yanıtı döndür. Yapı tam olarak şöyle olmalıdır:
{
  "questions": [
    {
      "question": "Soru kökü metni?",
      "options": ["A Seçeneği", "B Seçeneği", "C Seçeneği", "D Seçeneği"],
      "answer": "Doğru olan seçeneğin tam metni"
    }
  ]
}`;

        try {
            const res = await requestAI(systemPrompt, "PDF içeriğine dayanarak 4 adet çoktan seçmeli test sorusu hazırla.");

            // Dizi (Array) Garantileme Mekanizması
            let quizList = [];
            if (Array.isArray(res)) quizList = res;
            else if (res && Array.isArray(res.questions)) quizList = res.questions;
            else if (res && Array.isArray(res.quiz)) quizList = res.quiz;

            appState.quiz = quizList;
            renderQuiz();
            showStatus(`✅ ${quizList.length} adet test sorusu hazırlandı!`, "success");
        } catch (err) {
            console.error(err);
            showStatus("❌ Test Üretim Hatası: " + err.message, "error");
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        const countSpan = document.getElementById('quizCount');
        container.innerHTML = "";
        countSpan.innerText = appState.quiz.length;

        if (!Array.isArray(appState.quiz) || appState.quiz.length === 0) {
            container.innerHTML = `<p style="color: #777;">Test sorusu bulunamadı.</p>`;
            return;
        }

        appState.quiz.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';

            let html = `<h4>Soru ${idx + 1}: ${q.question}</h4>`;
            
            if (Array.isArray(q.options)) {
                q.options.forEach(opt => {
                    const safeOpt = String(opt).replace(/'/g, "\\'");
                    const safeAns = String(q.answer || '').replace(/'/g, "\\'");
                    html += `<button class="quiz-option" onclick="evaluateAnswer(this, '${safeOpt}', '${safeAns}')">${opt}</button>`;
                });
            }

            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function evaluateAnswer(btn, selected, correct) {
        const parent = btn.parentElement;
        const buttons = parent.querySelectorAll('.quiz-option');
        
        // Şıkların hepsini kilitler
        buttons.forEach(b => b.disabled = true);

        if (selected.trim().toLowerCase() === correct.trim().toLowerCase()) {
            btn.style.backgroundColor = "#c8e6c9";
            btn.style.borderColor = "#2e7d32";
            btn.innerText += "  ✅ (Doğru Cevap)";
        } else {
            btn.style.backgroundColor = "#ffcdd2";
            btn.style.borderColor = "#c62828";
            btn.innerText += `  ❌ (Yanlış! Doğru Cevap: ${correct})`;
        }
    }
</script>
</body>
</html>
